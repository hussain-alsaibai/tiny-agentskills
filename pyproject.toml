[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-agentskills"
version = "0.1.0"
description = "Zero-dependency runtime for Agent Skills (Anthropic-style SKILL.md bundles)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "OpenClaw", email = "hussain.alsaibai@gmail.com" }]
keywords = [
    "agent",
    "skills",
    "mcp",
    "anthropic",
    "openai",
    "agentic",
    "zero-dependency",
    "tiny",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-agentskills"
"Ecosystem Guide" = "https://github.com/hussain-alsaibai/dev-masterkit"

[project.scripts]
tiny-agentskills = "tiny_agentskills:main"

[tool.setuptools]
py-modules = ["tiny_agentskills"]

[tool.setuptools.package-data]
tiny_agentskills = ["py.typed"]
